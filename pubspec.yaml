name: spectra
description: "面向专业摄影师的 Windows 桌面端照片分类与资产管理（DAM）应用"
publish_to: "none"
version: 0.4.7

homepage: https://github.com/dsclca12/Spectra
repository: https://github.com/dsclca12/Spectra.git
issue_tracker: https://github.com/dsclca12/Spectra/issues
documentation: https://github.com/dsclca12/Spectra/docs

topics:
  - photography
  - dam
  - photo-management
  - windows
  - flutter

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 数据库
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.27
  path_provider: ^2.1.5
  path: ^1.9.0

  # 文件与系统
  watcher: ^1.1.1
  desktop_drop: ^0.5.0
  filepicker_windows: ^2.1.0
  window_manager: ^0.4.3

  # EXIF
  exif: ^3.3.0

  # 图像处理（编辑烘焙/导出）
  image: ^4.5.3

  # FFI（ONNX Runtime 绑定）
  ffi: ^2.1.3

  # 工具
  crypto: ^3.0.6
  collection: ^1.18.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # 代码生成
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

  # 测试
  mocktail: ^1.0.4

  # 打包
  msix: ^3.16.7

  # 分析
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

  shaders:
    - assets/shaders/photo_edit.frag

msix_config:
  display_name: Spectra
  publisher_display_name: Spectra Project
  identity_name: com.spectra.app
  msix_version: 0.4.6.0
  logo_path: assets/icons/app_icon.png
  capabilities: broadFileSystemAccess